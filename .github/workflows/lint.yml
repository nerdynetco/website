name: 🧹 Lint project

on: workflow_dispatch

# on:
#   push:
#     branches:
#       - '**'
#       # pull_request_target:
#       #   branches:
#       #     - '**'

#   pull_request:
#     branches:
#       - main
#       - staging
#   workflow_call:

concurrency:
  group:  ${{ github.workflow }}-${{ github.ref }}-lint
  cancel-in-progress: true

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # - uses: pnpm/action-setup@v4
      #   name: Install pnpm
        
      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.OS }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.OS }}-node-

      - name: 📦 Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --force
          fi

      - name: 📦 Install Turbo
        run: npm install turbo --global

      - name: 💾 Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: 🔍 Detect changed projects
        id: changed
        run: |
          # `git diff --quiet X || echo ...` treats non-existent paths as
          # "changed" (git exits non-zero with "bad revision"), so guard
          # each diff with a directory check first.
          for app in platform mail-server; do
            key="${app//-/_}_changed"
            if [ -d "./apps/$app" ] && ! git diff --quiet HEAD^ HEAD -- "./apps/$app"; then
              echo "$key=true" >> "$GITHUB_OUTPUT"
            else
              echo "$key=false" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: 🚀 Run Turbo lint selectively
        run: |
          for app in platform mail-server; do
            key="${app//-/_}_changed"
            if [ "${{ steps.changed.outputs.$key }}" = "true" ]; then
              npx turbo run lint --cache-dir=.turbo --filter="$app"
            fi
          done
